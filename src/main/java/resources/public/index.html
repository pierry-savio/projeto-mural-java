<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Mural</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }
        header{
            background: #e30613;
            color: #fff;
            padding: 24px;
            text-align: center;
        }
        main{
            width: min(700px, 92%);
            margin: 28px auto;
        }
        form, article{
            background-origin: #fff;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;

        }
        input, textarea, button{
            width: 100%;
            padding: 11px;
            margin: 8px 0 14px;
            font: inherit; 
        }
        textarea{
            min-height: 90px;
            resize: vertical;
        }
        button{
            background: #e30613;
            color: #fff;
            border: 0;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover{
            background: #b9040e;
        }
        h2{
            margin-top: 28px;
        }
        article{
            border-left: 5px solid #e30613;
        }
        article p{
            margin-bottom: 0;
        }
        #aviso{
            min-height: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!--Cria 3 divs com id diferente para cada-->
    <!-- div*3#seila$ -->

    <header>
        <h1>Mural de recados</h1>
        <p>Front + Java + JDBC + MySQL</p>
    </header>

    <main>
        
    </main>
</body>
</html>
